services:
  - type: web
    name: paybox-kreopoly-lens
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: .
    buildCommand: npm ci && npx esbuild src/http.ts --bundle --platform=node --format=esm --target=node20 --outfile=dist/http.js && npx esbuild src/index.ts --bundle --platform=node --format=esm --target=node20 --outfile=dist/index.js && ls -la dist/
    startCommand: node dist/http.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: POLYGON_RPC_URL
        value: https://polygon-rpc.com
